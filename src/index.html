<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ROSAT VİSİON TEKNOLOJİ A.Ş | Otonom Dron ve Yapay Zeka Altyapıları</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ROSAT VİSİON TEKNOLOJİ A.Ş - Yenilenebilir enerji sahaları, kritik altyapılar ve kriz yönetimi için otonom dron filoları ve yapay zeka tabanlı görüntü işleme teknolojileri.">
  <meta name="theme-color" content="#060c0a">
  <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('rosat_theme');
        if (saved === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
